name: Consolidated app records — source smoke

on:
  push:
    branches: [main]
    paths:
      - 'APP_INDEX.md'
      - 'project-image-downloader/**'
      - 'z-studio/**'
      - 'Z_CapCut/**'
      - 'third_party/autocapcut/**'
      - '.github/workflows/app-records-smoke.yml'
  pull_request:
    paths:
      - 'APP_INDEX.md'
      - 'project-image-downloader/**'
      - 'z-studio/**'
      - 'Z_CapCut/**'
      - 'third_party/autocapcut/**'
      - '.github/workflows/app-records-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical app folder records
        run: |
          test -f APP_INDEX.md
          test -f project-image-downloader/extension/manifest.json
          test -f project-image-downloader/package.json
          test -f z-studio/assemble_source.py
          test -f Z_CapCut/capability_manifest.json
          test -f third_party/autocapcut/analyze_installer.py
      - name: Project Image Downloader logic tests
        working-directory: project-image-downloader
        run: npm test
      - name: Z Studio offline launcher tests
        run: python -m unittest discover -s z-studio/tests -p 'test_*.py' -v
      - name: AutoCapCut read-only analyzer fixture tests
        run: python -m unittest discover -s third_party/autocapcut -p 'test_*.py' -v
