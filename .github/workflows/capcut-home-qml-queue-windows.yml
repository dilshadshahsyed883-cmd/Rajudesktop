name: CapCut Home QML queue — native-bound UI tests
on:
  pull_request:
    paths:
      - 'capcut_home_native_queue/**'
      - '.github/workflows/capcut-home-qml-queue-windows.yml'
  push:
    branches: [main]
    paths:
      - 'capcut_home_native_queue/**'
      - '.github/workflows/capcut-home-qml-queue-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-home-panel:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt 6 QML runtime for real component tests
        shell: pwsh
        run: |
          python -m pip install PySide6-Essentials==6.8.3
          if ($LASTEXITCODE -ne 0) { throw 'Qt install failed' }
      - name: Real Qt QML load, selection, strict native acceptance and serial completion
        shell: pwsh
        run: |
          python -m unittest discover -s capcut_home_native_queue/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'QML native queue contract failed' }
      - name: Live process feasibility script smoke test (no CapCut on runner)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'capcut-live-runtime-smoke.json'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File capcut_home_native_queue/CapCut_Live_Bridge_Check.ps1 -OutFile $report
          if ($LASTEXITCODE -ne 0) { throw 'Live bridge check script failed' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          if ($result.schema -ne 'capcut-9.7-live-qt-bridge-feasibility-v1') { throw 'Unexpected report schema' }
          if ($result.original_capcut_files_modified -ne $false -or
              $result.process_injection_or_attachment_attempted -ne $false -or
              $result.debugger_port_connection_attempted -ne $false -or
              $result.live_qobject_verified -ne $false -or
              $result.unattended_capcut_mp4_export_verified -ne $false) {
            throw 'Read-only or unverified guard failed'
          }
          Write-Output ('LIVE_RUNTIME_SMOKE=' + $result.status)
      - name: No modified CapCut binaries or separate renderer shipped
        shell: pwsh
        run: |
          $bad = Get-ChildItem capcut_home_native_queue -Recurse -File | Where-Object { $_.Extension -in @('.dll','.exe','.mp4') }
          if ($bad) { throw 'Unauthorized binary artifact in Home QML panel' }
          Write-Output 'QML_PANEL_ONLY=true'
          Write-Output 'CAPCUT_NATIVE_RENDER_LIVE_VERIFIED=false'
