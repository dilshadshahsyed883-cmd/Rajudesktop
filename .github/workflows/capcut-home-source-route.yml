name: CapCut 9.7 embedded Home click-route research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-route:
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile test without loading original binary
        shell: pwsh
        run: |
          python -m py_compile capcut_home_native_queue/research_embedded_home_route.py
          if ($LASTEXITCODE -ne 0) { throw 'Source route tool invalid' }
      - name: Read only original split archive, if its existing shared links allow access
        shell: pwsh
        run: |
          python -m pip install gdown==5.2.0
          if ($LASTEXITCODE -ne 0) { throw 'gdown dependency failed' }
          New-Item -ItemType Directory -Force 'temporary-capcut' | Out-Null
          $dl5 = "https://drive.google.com/file/d/1W71Mmw4Beo8JqGRuWtCWPjjxCJ8xfvBi/view"
          $dl6 = "https://drive.google.com/file/d/1LFBW2AK1ZyuMWLcYSO6lWv_k1n3z0RcJ/view"
          gdown --fuzzy $dl5 -O temporary-capcut/part005.bin
          $status5 = $LASTEXITCODE
          if ($status5 -eq 0) {
            gdown --fuzzy $dl6 -O temporary-capcut/part006.bin
            $status6 = $LASTEXITCODE
          } else {
            $status6 = 1
          }
          if ($status5 -ne 0 -or $status6 -ne 0) {
            '{"status":"SOURCE_LINK_NOT_PUBLIC_OR_DOWNLOAD_FAILED","no_binary_modified":true,"native_export_verified":false}' | Out-File -Encoding utf8 'home_route.json'
            Write-Output 'SOURCE_ROUTE_STATUS=SOURCE_LINK_NOT_PUBLIC_OR_DOWNLOAD_FAILED'
            exit 0
          }
          python capcut_home_native_queue/research_embedded_home_route.py --part5 temporary-capcut/part005.bin --part6 temporary-capcut/part006.bin --out home_route.json
          if ($LASTEXITCODE -ne 0) { throw 'Original binary integrity or QML extraction failed' }
      - name: Delete temporary original archive chunks (never upload binaries)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path temporary-capcut) { Remove-Item -Recurse -Force temporary-capcut }
          Write-Output 'TEMP_CAPCUT_BYTES_DELETED=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capcut-97-home-callsite-evidence-only
          path: home_route.json
          if-no-files-found: warn
          retention-days: 2
