name: CapCut Visual Controls Standalone V2 - tests and Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'capcut_visual_controls_standalone/**'
      - '.github/workflows/capcut-visual-controls-standalone.yml'
  pull_request:
    paths:
      - 'capcut_visual_controls_standalone/**'
      - '.github/workflows/capcut-visual-controls-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q capcut_visual_controls_standalone
      - name: Native draft and rollback tests
        run: python -m unittest discover -s capcut_visual_controls_standalone/tests -p 'test_*.py' -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test on Windows
        shell: pwsh
        run: python -m unittest discover -s capcut_visual_controls_standalone/tests -p 'test_*.py' -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build one-file Windows EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CapCutVisualControlsV2 --paths capcut_visual_controls_standalone capcut_visual_controls_standalone/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CapCutVisualControlsV2-Windows-EXE
          path: dist/CapCutVisualControlsV2.exe
          if-no-files-found: error
          retention-days: 30
