name: Clear Actions artifacts once
on:
  push:
    branches: [maintenance/clear-actions-artifacts-20261126]
    paths: [.github/workflows/clear-actions-artifacts-once.yml]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete all existing repository artifacts and verify
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...repo, per_page: 100});
            let deleted = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({...repo, artifact_id: artifact.id});
              deleted++;
              bytes += artifact.size_in_bytes;
              core.info('Deleted artifact ' + artifact.id + ': ' + artifact.name);
            }
            const remaining = await github.rest.actions.listArtifactsForRepo({...repo, per_page: 1});
            core.info(JSON.stringify({deleted, bytes, remaining: remaining.data.total_count}));
            await core.summary.addHeading('Actions artifact cleanup').addTable([
              [{data: 'Deleted artifacts', header: true}, {data: 'Deleted bytes', header: true}, {data: 'Remaining artifacts', header: true}],
              [String(deleted), String(bytes), String(remaining.data.total_count)]
            ]).write();
            if (remaining.data.total_count !== 0) core.setFailed('Artifacts remain; inspect concurrent uploads.');
