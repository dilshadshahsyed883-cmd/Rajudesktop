name: Concat Original Windows EXE (verified upstream)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/concat-original-windows-20261104
    paths:
      - .github/workflows/concat-original-windows.yml
      - concat_original/**
  pull_request:
    paths:
      - .github/workflows/concat-original-windows.yml
      - concat_original/**

permissions:
  contents: read

concurrency:
  group: concat-original-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Verify and publish original Concat Windows installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout Rajudesktop
        uses: actions/checkout@v4

      - name: Set up Python for verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run checksum-verifier tests
        shell: pwsh
        run: python -m unittest discover -s concat_original/tests -v

      - name: Download Concat v0.2.8 Windows x64 setup from official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          gh release download v0.2.8 --repo jub0t/Concat --pattern "windows-x86_64-setup.exe" --pattern "SHA256SUMS" --dir dist
          if ($LASTEXITCODE -ne 0) { throw "Upstream download failed" }
          Write-Host "Actual upstream asset names:"
          gh release view v0.2.8 --repo jub0t/Concat --json assets --jq '.assets[].name'
          Write-Host "Downloaded files:"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Verify SHA256, Windows PE header and installer size
        shell: pwsh
        run: |
          python concat_original/verify_release.py --installer dist/windows-x86_64-setup.exe --checksums dist/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "Upstream installer verification failed" }

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Concat-v0.2.8-Windows-x64
          path: |
            dist/windows-x86_64-setup.exe
            dist/SHA256SUMS
            concat_original/README.md
          if-no-files-found: error
          retention-days: 30
