name: Edge Voice Studio - tests and manual Windows package

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "edge_voice_studio/**"
      - "tests/test_edge_voice.py"
      - "launch_edge_voice.py"
      - "requirements-edge-voice.txt"
      - ".github/workflows/edge-voice.yml"
  pull_request:
    paths:
      - "edge_voice_studio/**"
      - "tests/test_edge_voice.py"
      - "launch_edge_voice.py"
      - "requirements-edge-voice.txt"
      - ".github/workflows/edge-voice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-voice-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-edge-voice.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-edge-voice.txt
      - name: Validate Python sources
        run: python -m compileall -q edge_voice_studio launch_edge_voice.py
      - name: Offline rendering and persistent store tests
        run: python -m unittest discover -s tests -p "test_edge_voice*.py" -v
      - name: Native Windows GUI smoke test without a TTS network request
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from edge_voice_studio.window import StudioWindow; a=QApplication([]); w=StudioWindow(); assert w.stack.count()==6; w.close(); print('UI smoke passed')"

  edge-voice-portable:
    # One-time signed-in download artifact for the requested Windows EXE.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/edge-tts-exe-build-20261027')
    needs: edge-voice-tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-edge-voice.txt
      - name: Install build tools
        run: python -m pip install -r requirements-edge-voice.txt "pyinstaller>=6.11,<7"
      - name: Build standalone EdgeVoiceStudio folder
        run: pyinstaller --noconfirm --clean --onedir --windowed --name EdgeVoiceStudio --collect-all edge_tts --collect-all imageio_ffmpeg launch_edge_voice.py
      - name: Verify packaged executable and checksum
        shell: pwsh
        run: |
          if (!(Test-Path dist/EdgeVoiceStudio/EdgeVoiceStudio.exe)) { throw "Missing EdgeVoiceStudio.exe" }
          $sha = (Get-FileHash dist/EdgeVoiceStudio/EdgeVoiceStudio.exe -Algorithm SHA256).Hash
          @{ build_sha = "$env:GITHUB_SHA"; exe_sha256 = $sha; app = "Edge Voice Studio"; install = "Manual"; service = "Online Edge TTS" } |
            ConvertTo-Json | Set-Content dist/EdgeVoiceStudio/build-manifest.json -Encoding utf8
          Compress-Archive -Path dist/EdgeVoiceStudio -DestinationPath EdgeVoiceStudio-windows-x64.zip
          (Get-FileHash EdgeVoiceStudio-windows-x64.zip -Algorithm SHA256).Hash |
            Set-Content EdgeVoiceStudio-windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeVoiceStudio-windows-x64
          path: |
            EdgeVoiceStudio-windows-x64.zip
            EdgeVoiceStudio-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
