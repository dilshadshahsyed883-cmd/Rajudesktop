name: Short Studio - Windows standalone EXE

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'short_studio/**'
      - 'launch_short_studio.py'
      - 'start_short_studio.bat'
      - 'tests/test_short_studio.py'
      - '.github/workflows/short-studio-windows.yml'
  pull_request:
    paths:
      - 'short_studio/**'
      - 'launch_short_studio.py'
      - 'tests/test_short_studio.py'
      - '.github/workflows/short-studio-windows.yml'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies and PyInstaller
        run: python -m pip install -r short_studio/requirements.txt pyinstaller==6.16.0
      - name: Offline regression tests and syntax
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_short_studio.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Short Studio offline tests failed' }
          python -m compileall -q short_studio launch_short_studio.py
          if ($LASTEXITCODE -ne 0) { throw 'Short Studio syntax check failed' }
      - name: Bundle FFmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg-out"
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-out" -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg executable missing' }
          New-Item -ItemType Directory -Force -Path short_studio/bin | Out-Null
          Copy-Item $ffmpeg.FullName short_studio/bin/ffmpeg.exe
      - name: Build onefile ShortStudio.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name ShortStudio --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-submodules google --add-binary 'short_studio/bin/ffmpeg.exe;bin' launch_short_studio.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path dist/ShortStudio.exe)) { throw 'Missing ShortStudio.exe' }
          if ((Get-Item dist/ShortStudio.exe).Length -lt 10000000) { throw 'Unexpectedly small EXE' }
          (Get-FileHash dist/ShortStudio.exe -Algorithm SHA256).Hash.ToLower() | Set-Content dist/ShortStudio.exe.sha256
      - name: Test real frozen EXE and GUI launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist/ShortStudio.exe).Path
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Frozen engine self-test failed: $($test.ExitCode)" }
          $gui = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $gui.Refresh()
            if ($gui.HasExited) { throw "Frozen GUI closed unexpectedly: $($gui.ExitCode)" }
          } finally {
            & taskkill.exe /F /T /PID $gui.Id 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ShortStudio-Windows-EXE
          path: |
            dist/ShortStudio.exe
            dist/ShortStudio.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct EXE on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "short-studio-run-$env:GITHUB_RUN_NUMBER"
          gh release create $tag dist/ShortStudio.exe dist/ShortStudio.exe.sha256 --title "Short Studio - Standalone Windows EXE" --notes "Short Maker and Short Uploader in one Windows EXE. Local 9:16 render queues, grouped channel profiles and YouTube OAuth. Requires user supplied Desktop OAuth client for uploading. No changes to VPS." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Direct EXE release failed' }
