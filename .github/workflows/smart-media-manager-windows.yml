name: Smart Media Manager - Single EXE

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "smart_media_manager/**"
      - "launch_smart_media_manager.py"
      - "tests/test_smart_media_manager.py"
      - "tests/test_cutter_queue.py"
      - "tests/test_snapshots_local.py"
      - "SMART_MEDIA_MANAGER.md"
      - ".github/workflows/smart-media-manager-windows.yml"
  pull_request:
    paths:
      - "smart_media_manager/**"
      - "launch_smart_media_manager.py"
      - "tests/test_smart_media_manager.py"
      - "tests/test_cutter_queue.py"
      - "tests/test_snapshots_local.py"
      - "SMART_MEDIA_MANAGER.md"
      - ".github/workflows/smart-media-manager-windows.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test all four media engines and integration
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_video_clip_cutter.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Cutter tests failed' }
          python -m unittest discover -s tests -p test_image_renamer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Image tests failed' }
          python -m unittest discover -s tests -p test_smart_clip_renamer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Clip renamer tests failed' }
          python -m unittest discover -s tests -p test_smart_media_manager.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Manager tests failed' }
          python -m unittest discover -s tests -p test_youtube_downloader.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Downloader tests failed' }
          python -m unittest discover -s tests -p test_cutter_queue.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Batch cutter tests failed' }
          python -m unittest discover -s tests -p test_snapshots_local.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Local snapshot tests failed' }
          python -m compileall -q smart_media_manager
      - name: Install Windows packager
        run: python -m pip install pyinstaller==6.16.0 "yt-dlp[default]>=2025.1.1"
      - name: Bundle FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg-dist"
          New-Item -ItemType Directory -Force -Path 'video_clip_cutter\bin' | Out-Null
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-dist" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-dist" -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg executables missing' }
          Copy-Item $ffmpeg.FullName 'video_clip_cutter\bin\ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'video_clip_cutter\bin\ffprobe.exe'
      - name: Build portable all-in-one SmartMediaManager.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SmartMediaManager --collect-all yt_dlp --add-binary 'video_clip_cutter/bin/ffmpeg.exe;bin' --add-binary 'video_clip_cutter/bin/ffprobe.exe;bin' launch_smart_media_manager.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller onefile build failed' }
          if (-not (Test-Path 'dist\SmartMediaManager.exe' -PathType Leaf)) { throw 'Single EXE missing' }
          $bytes = (Get-Item 'dist\SmartMediaManager.exe').Length
          if ($bytes -lt 10000000) { throw "Unexpectedly small single EXE: $bytes bytes" }
          (Get-FileHash 'dist\SmartMediaManager.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist\SmartMediaManager.exe.sha256'
      - name: Smoke test standalone EXE launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\SmartMediaManager.exe').Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) { throw "Single EXE exited unexpectedly during GUI launch (code $($proc.ExitCode))" }
          }
          finally {
            & taskkill.exe /F /T /PID $proc.Id 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMediaManager-Single-EXE
          path: |
            dist/SmartMediaManager.exe
            dist/SmartMediaManager.exe.sha256
          if-no-files-found: error
      - name: Publish direct EXE release on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "smart-media-manager-v3-onefile-run-$env:GITHUB_RUN_NUMBER"
          gh release create $tag dist/SmartMediaManager.exe dist/SmartMediaManager.exe.sha256 --title "Smart Media Manager V3 — Single Portable EXE" --notes "Direct download: SmartMediaManager.exe. No ZIP, no manual extraction, no adjacent folders. Bundles FFmpeg, FFprobe, yt-dlp and all four tools including mixed PC/YouTube batch cutter and PC snapshots. Windows may temporarily unpack internal resources automatically during execution." --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw 'Direct EXE release publishing failed' }
