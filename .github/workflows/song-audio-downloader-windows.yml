name: Song Audio Downloader - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'song_audio_downloader/**'
      - 'launch_song_audio_downloader.py'
      - 'tests/test_song_audio_downloader.py'
      - '.github/workflows/song-audio-downloader-windows.yml'
  pull_request:
    paths:
      - 'song_audio_downloader/**'
      - 'launch_song_audio_downloader.py'
      - 'tests/test_song_audio_downloader.py'
      - '.github/workflows/song-audio-downloader-windows.yml'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests, existing engine regression and source compile
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_song_audio_downloader.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Standalone tests failed' }
          python -m unittest discover -s tests -p test_youtube_downloader.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Existing downloader regression failed' }
          python -m compileall -q song_audio_downloader launch_song_audio_downloader.py
      - name: Install Windows builder and working downloader engine
        run: python -m pip install 'pyinstaller==6.16.0' 'yt-dlp[default]>=2025.1.1'
      - name: Bundle FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg-dist"
          New-Item -ItemType Directory -Force -Path 'song_audio_downloader\bin' | Out-Null
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-dist" -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-dist" -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg files missing' }
          Copy-Item $ffmpeg.FullName 'song_audio_downloader\bin\ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'song_audio_downloader\bin\ffprobe.exe'
      - name: Build onefile portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SongAudioDownloader --collect-all yt_dlp --hidden-import smart_media_manager.cutter_queue --add-binary 'song_audio_downloader/bin/ffmpeg.exe;bin' --add-binary 'song_audio_downloader/bin/ffprobe.exe;bin' launch_song_audio_downloader.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path 'dist\SongAudioDownloader.exe')) { throw 'EXE missing' }
          if ((Get-Item 'dist\SongAudioDownloader.exe').Length -lt 10000000) { throw 'Unexpectedly small EXE' }
          (Get-FileHash 'dist\SongAudioDownloader.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist\SongAudioDownloader.exe.sha256'
      - name: Frozen self-test and GUI launch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\SongAudioDownloader.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Frozen self-test failed: $($test.ExitCode)" }
          $gui = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $gui.Refresh()
            if ($gui.HasExited) { throw "GUI exited early: $($gui.ExitCode)" }
          } finally {
            & taskkill.exe /F /T /PID $gui.Id 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SongAudioDownloader-Windows-EXE
          path: |
            dist/SongAudioDownloader.exe
            dist/SongAudioDownloader.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct EXE release after merging to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "song-audio-downloader-run-$env:GITHUB_RUN_NUMBER"
          gh release create $tag 'dist/SongAudioDownloader.exe' 'dist/SongAudioDownloader.exe.sha256' --title 'Song Audio Downloader - Windows EXE' --notes 'Independent Smart Media Manager downloader with VideoID audio/JPG matching, existing video/snapshots workflow and separate persistent queue.' --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Direct EXE release failed' }
