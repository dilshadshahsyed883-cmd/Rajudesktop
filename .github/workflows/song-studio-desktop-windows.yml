name: Song Studio Desktop - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'song_studio/**'
      - 'song_audio_downloader/**'
      - 'smart_media_manager/youtube_downloader.py'
      - 'launch_song_studio.py'
      - 'tests/test_song_studio.py'
      - '.github/workflows/song-studio-desktop-windows.yml'
  pull_request:
    paths:
      - 'song_studio/**'
      - 'launch_song_studio.py'
      - 'tests/test_song_studio.py'
      - '.github/workflows/song-studio-desktop-windows.yml'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests - all three modules and existing audio engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p test_song_studio.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Song Studio tests failed' }
          python -m unittest discover -s tests -p test_song_audio_downloader.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Downloader regression failed' }
          python -m compileall -q song_studio launch_song_studio.py
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed' }
      - name: Install portable app dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'pyinstaller==6.16.0' 'yt-dlp[default]>=2025.1.1' 'google-api-python-client>=2.130,<3' 'google-auth-oauthlib>=1.2,<2'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Bundle signed-distribution FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg-tools"
          New-Item -ItemType Directory -Force 'song_studio\bin' | Out-Null
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-tools" -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-tools" -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg tools missing' }
          Copy-Item $ffmpeg.FullName 'song_studio\bin\ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'song_studio\bin\ffprobe.exe'
      - name: Build portable single-file SongStudio.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SongStudio --collect-all yt_dlp --collect-submodules googleapiclient --collect-submodules google_auth_oauthlib --collect-submodules google.auth --hidden-import certifi --add-binary 'song_studio/bin/ffmpeg.exe;bin' --add-binary 'song_studio/bin/ffprobe.exe;bin' launch_song_studio.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist\SongStudio.exe')) { throw 'SongStudio.exe missing' }
          if ((Get-Item 'dist\SongStudio.exe').Length -lt 10000000) { throw 'Unexpectedly small EXE' }
          (Get-FileHash 'dist\SongStudio.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist\SongStudio.exe.sha256'
      - name: Frozen executable self-test and real GUI boot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\SongStudio.exe').Path
          $check = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "EXE self-test failed with $($check.ExitCode)" }
          $gui = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $gui.Refresh()
            if ($gui.HasExited) { throw "SongStudio GUI exited: $($gui.ExitCode)" }
          }
          finally {
            & taskkill.exe /F /T /PID $gui.Id 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SongStudio-Windows-Standalone-EXE
          path: |
            dist/SongStudio.exe
            dist/SongStudio.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct Windows EXE on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "song-studio-desktop-run-$env:GITHUB_RUN_NUMBER"
          gh release create $tag 'dist/SongStudio.exe' 'dist/SongStudio.exe.sha256' --title 'Song Studio - Windows Standalone EXE' --notes 'One portable SongStudio.exe: downloader, song maker and group YouTube uploader. Media and OAuth tokens stay on the PC. Read SONG_STUDIO_DESKTOP.md for supported features and limitations.' --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Direct EXE release failed' }
