name: Voice to SRT Studio Batch Windows EXE

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'voice_to_srt_batch/**'
      - '.github/workflows/voice-to-srt-batch-windows-exe.yml'
  pull_request:
    paths:
      - 'voice_to_srt_batch/**'
      - '.github/workflows/voice-to-srt-batch-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: voice_to_srt_batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech engine and Windows EXE packager
        run: python -m pip install -r requirements-voice-to-srt.txt "pyinstaller>=6.11,<7"
      - name: Validate source and run batch regression tests
        shell: pwsh
        run: |
          python -m compileall -q voice_to_srt_studio launch_voice_to_srt.py
          if ($LASTEXITCODE -ne 0) { throw "Source compilation failed" }
          python -m unittest discover -s tests -p 'test_voice_to_srt_batch.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Batch unit tests failed" }
          python launch_voice_to_srt.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency smoke test failed" }
      - name: Build standalone portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VoiceToSRTStudioBatch `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all onnxruntime `
            launch_voice_to_srt.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path 'dist/VoiceToSRTStudioBatch.exe')) { throw "EXE missing" }
          $exe = Get-Item 'dist/VoiceToSRTStudioBatch.exe'
          if ($exe.Length -lt 10000000) { throw "EXE unexpectedly small" }
          Write-Host "Standalone EXE size: $($exe.Length) bytes"
      - name: Verify real frozen executable starts and exits successfully
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/VoiceToSRTStudioBatch.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Frozen EXE smoke test failed: $($process.ExitCode)" }
          Write-Host 'Frozen speech engine imports and SRT conversion passed'
      - name: Package EXE ZIP and SHA256 checksums
        shell: pwsh
        run: |
          Copy-Item VOICE_TO_SRT_STUDIO.md dist/README.txt
          "VoiceToSRTStudioBatch.exe - Windows portable executable. Double-click to run. No Python required. First speech model download requires internet." | Set-Content dist/HOW_TO_RUN.txt
          Compress-Archive -Path dist/VoiceToSRTStudioBatch.exe,dist/README.txt,dist/HOW_TO_RUN.txt -DestinationPath Voice-To-SRT-Studio-Batch-Windows-EXE.zip -CompressionLevel Optimal
          (Get-FileHash dist/VoiceToSRTStudioBatch.exe -Algorithm SHA256).Hash.ToLower() | Set-Content VoiceToSRTStudioBatch.exe.sha256
          (Get-FileHash Voice-To-SRT-Studio-Batch-Windows-EXE.zip -Algorithm SHA256).Hash.ToLower() | Set-Content Voice-To-SRT-Studio-Batch-Windows-EXE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Voice-To-SRT-Studio-Batch-Windows-EXE
          path: |
            voice_to_srt_batch/Voice-To-SRT-Studio-Batch-Windows-EXE.zip
            voice_to_srt_batch/VoiceToSRTStudioBatch.exe.sha256
            voice_to_srt_batch/Voice-To-SRT-Studio-Batch-Windows-EXE.zip.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-download GitHub release when merged to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "voice-to-srt-batch-v1-run-$env:GITHUB_RUN_NUMBER"
          gh release create $tag Voice-To-SRT-Studio-Batch-Windows-EXE.zip dist/VoiceToSRTStudioBatch.exe VoiceToSRTStudioBatch.exe.sha256 Voice-To-SRT-Studio-Batch-Windows-EXE.zip.sha256 --title "Voice to SRT Studio Batch - Windows EXE" --notes "Portable one-file Windows executable with batch voice transcription, word-aligned SRT, progress queue and retry. No Python installation. First use downloads selected Whisper model." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
