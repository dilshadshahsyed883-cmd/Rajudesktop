name: Scene Desktop Studio — Windows integration, package and manual delivery

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned-range build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify packaged local Whisper dependency
        run: python -c "from faster_whisper import WhisperModel; print('WHISPER_RUNTIME_IMPORT=PASS')"
      - name: Model and real FFmpeg export tests
        run: python -m unittest discover -s tests -v
      - name: Validate manual Windows installer PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Install-SceneDesktop.ps1), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Compile application sources
        run: python -m compileall -q scene_desktop launch.py
      - name: Package a portable Windows app folder with local Whisper runtime
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SceneDesktopStudio --collect-all imageio_ffmpeg
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all tokenizers --collect-all av
          --collect-all onnxruntime --collect-all huggingface_hub
          launch.py
      - name: Smoke launch the packaged Windows GUI (no production machine)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = "dist/SceneDesktopStudio/SceneDesktopStudio.exe"
          if (!(Test-Path $exe)) { throw "Build executable missing" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged app crashed on launch (exit $($process.ExitCode))" }
            Write-Output "HEADLESS_WINDOWS_GUI_LAUNCH=PASS"
          }
          finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify bundled executable and write manifest
        shell: pwsh
        run: |
          if (!(Test-Path dist/SceneDesktopStudio/SceneDesktopStudio.exe)) { throw "Windows executable missing" }
          $sha = (Get-FileHash dist/SceneDesktopStudio/SceneDesktopStudio.exe -Algorithm SHA256).Hash
          $info = @{ build_sha = "$env:GITHUB_SHA"; executable_sha256 = $sha; project = "Rajudesktop Scene Desktop Studio"; install = "Manual Tailscale only"; note = "Original video audio opt-in; resource/performance validation required on target machine" }
          $info | ConvertTo-Json | Set-Content dist/SceneDesktopStudio/build-manifest.json -Encoding UTF8
          Copy-Item scripts/Install-SceneDesktop.ps1 dist/SceneDesktopStudio/Install-SceneDesktop.ps1
          Copy-Item scripts/Install-SceneDesktop.ps1 Install-SceneDesktop.ps1
          Copy-Item docs/THIRD_PARTY_NOTICES.txt dist/SceneDesktopStudio/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path dist/SceneDesktopStudio -DestinationPath SceneDesktopStudio-windows-x64.zip -CompressionLevel Optimal
          (Get-FileHash SceneDesktopStudio-windows-x64.zip -Algorithm SHA256).Hash | Set-Content SceneDesktopStudio-windows-x64.zip.sha256 -Encoding ascii
      - name: Validate manual installer and app-only rollback on Windows CI runner
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "scene-manual-installer-test"
          $installerArgs = @{
            ArtifactZip = "SceneDesktopStudio-windows-x64.zip"
            ChecksumFile = "SceneDesktopStudio-windows-x64.zip.sha256"
            InstallRoot = $root
            SkipLaunchSmoke = $true
          }
          & ./Install-SceneDesktop.ps1 @installerArgs
          if (!(Test-Path (Join-Path $root "current/SceneDesktopStudio.exe"))) { throw "Installer missing EXE" }
          New-Item -ItemType Directory -Path (Join-Path $root "project-data") -Force | Out-Null
          "PRESERVE" | Set-Content (Join-Path $root "project-data/project.txt")
          & ./Install-SceneDesktop.ps1 @installerArgs
          if (!(Test-Path (Join-Path $root "project-data/project.txt"))) { throw "Installer touched project data" }
          if (!(Get-ChildItem (Join-Path $root "backups") -Directory)) { throw "App release backup absent" }
          $receipt = Get-Content (Join-Path $root "last-install.json") -Raw | ConvertFrom-Json
          if ($receipt.result -ne "MANUAL_INSTALL_PASS") { throw "No install receipt" }
          Write-Output "CI_ONLY_MANUAL_INSTALL_AND_BACKUP=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: SceneDesktopStudio-windows-x64-${{ github.sha }}
          path: |
            SceneDesktopStudio-windows-x64.zip
            SceneDesktopStudio-windows-x64.zip.sha256
            Install-SceneDesktop.ps1
          if-no-files-found: error
          retention-days: 14
