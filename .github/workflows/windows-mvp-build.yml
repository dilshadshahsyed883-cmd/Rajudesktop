name: Scene Desktop Studio — Windows integration, package and manual delivery

# Owner-authorized ONE-TIME release: only the exact marker file triggers
# packaging on push; all other feature commits run source tests, not PyInstaller.
on:
  push:
    branches: ["feature/full-desktop-studio-unified-20261022"]
    paths:
      - "release/BUILD_REQUEST_20261022.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned-range build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify packaged local Whisper dependency
        run: python -c "from faster_whisper import WhisperModel; print('WHISPER_RUNTIME_IMPORT=PASS')"
      - name: Model and real FFmpeg export tests
        run: python -m unittest discover -s tests -v
      - name: Validate manual Windows installer PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Install-SceneDesktop.ps1), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Compile application sources
        run: python -m compileall -q scene_desktop launch.py
      - name: Package a portable Windows app folder with local Whisper runtime
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SceneDesktopStudio --collect-all imageio_ffmpeg
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all tokenizers --collect-all av
          --collect-all onnxruntime --collect-all huggingface_hub
          --collect-all OpenGL --hidden-import PySide6.QtOpenGLWidgets
          --collect-all scene_desktop.offline_sml_backend
          --add-data "scene_desktop/offline_sml_backend/static;scene_desktop/offline_sml_backend/static"
          --hidden-import PySide6.QtWebEngineWidgets
          --hidden-import PySide6.QtWebEngineCore
          --collect-all fastapi --collect-all uvicorn
          --collect-all PIL --collect-all multipart
          launch.py
      - name: Verify Whisper dependency imports inside packaged EXE
        shell: pwsh
        run: |
          $exe = "dist/SceneDesktopStudio/SceneDesktopStudio.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--check-whisper-runtime" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged Whisper runtime is missing or broken (exit $($proc.ExitCode))" }
          Write-Output "PACKAGED_WHISPER_RUNTIME=PASS"
      - name: Verify GPU preview runtime inside Windows EXE
        shell: pwsh
        run: |
          $exe = "dist/SceneDesktopStudio/SceneDesktopStudio.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--check-gpu-runtime" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged Qt/OpenGL backend missing (exit $($proc.ExitCode))" }
          Write-Output "PACKAGED_GPU_PREVIEW_RUNTIME=PASS"
      - name: Verify offline SML runtime embedded inside Windows EXE
        shell: pwsh
        run: |
          $exe = "dist/SceneDesktopStudio/SceneDesktopStudio.exe"
          # Start-Process -Wait waits for a full Windows process tree, including
          # Qt WebEngine helpers. Wait only for our EXE, with bounded timeout.
          $proc = Start-Process -FilePath $exe -ArgumentList "--check-offline-sml-runtime" -PassThru
          if (!$proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged SML import check timed out after 90 seconds"
          }
          $proc.Refresh()
          if ($proc.ExitCode -ne 0) { throw "Bundled SML backend/WebEngine import failure: $($proc.ExitCode)" }
          Write-Output "PACKAGED_OFFLINE_SML_IMPORT=PASS"
      - name: Verify packaged local SML server and original UI are functional
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/SceneDesktopStudio/SceneDesktopStudio.exe").Path
          $data = Join-Path $env:RUNNER_TEMP "final-offline-sml-server-test"
          $port = Get-Random -Minimum 45000 -Maximum 59999
          $arguments = '--offline-sml-server --port {0} --data-dir "{1}"' -f $port, $data
          $proc = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 55; $attempt++) {
              Start-Sleep -Milliseconds 500
              $proc.Refresh()
              if ($proc.HasExited) { throw "Packaged SML server exited: $($proc.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/__sml_desktop_health" -TimeoutSec 2
                if ($health.ok -eq $true) { break }
              }
              catch { }
            }
            if ($health.ok -ne $true -or $health.mode -ne "offline-local") {
              throw "Bundled local SML health was not available"
            }
            $index = Invoke-WebRequest -Uri "http://127.0.0.1:$port/self-media-library/" -TimeoutSec 10
            if ($index.StatusCode -ne 200 -or !$index.Content.Contains('page-dashboard')) {
              throw "Original SML dashboard missing in packaged EXE"
            }
            $api = Invoke-RestMethod -Uri "http://127.0.0.1:$port/self-media-library/api/health" -TimeoutSec 10
            if (!$api.ok -or $api.storage_mode -ne "desktop_offline") {
              throw "Desktop SML local API not initialized"
            }
            Write-Output "PACKAGED_SML_LOCAL_SERVER_UI_API=PASS"
          }
          finally {
            $proc.Refresh()
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Smoke launch the packaged Windows GUI (no production machine)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = "dist/SceneDesktopStudio/SceneDesktopStudio.exe"
          if (!(Test-Path $exe)) { throw "Build executable missing" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged app crashed on launch (exit $($process.ExitCode))" }
            Write-Output "HEADLESS_WINDOWS_GUI_LAUNCH=PASS"
          }
          finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify bundled executable and write manifest
        shell: pwsh
        run: |
          if (!(Test-Path dist/SceneDesktopStudio/SceneDesktopStudio.exe)) { throw "Windows executable missing" }
          $sha = (Get-FileHash dist/SceneDesktopStudio/SceneDesktopStudio.exe -Algorithm SHA256).Hash
          $info = @{ build_sha = "$env:GITHUB_SHA"; executable_sha256 = $sha; project = "Rajudesktop Scene Desktop Studio"; install = "Manual Tailscale only"; note = "Original video audio opt-in; resource/performance validation required on target machine" }
          $info | ConvertTo-Json | Set-Content dist/SceneDesktopStudio/build-manifest.json -Encoding UTF8
          Copy-Item scripts/Install-SceneDesktop.ps1 dist/SceneDesktopStudio/Install-SceneDesktop.ps1
          Copy-Item scripts/Install-SceneDesktop.ps1 Install-SceneDesktop.ps1
          Copy-Item docs/THIRD_PARTY_NOTICES.txt dist/SceneDesktopStudio/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path dist/SceneDesktopStudio -DestinationPath SceneDesktopStudio-windows-x64.zip -CompressionLevel Optimal
          (Get-FileHash SceneDesktopStudio-windows-x64.zip -Algorithm SHA256).Hash | Set-Content SceneDesktopStudio-windows-x64.zip.sha256 -Encoding ascii
      - name: Validate manual installer and app-only rollback on Windows CI runner
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "scene-manual-installer-test"
          $installerArgs = @{
            ArtifactZip = "SceneDesktopStudio-windows-x64.zip"
            ChecksumFile = "SceneDesktopStudio-windows-x64.zip.sha256"
            InstallRoot = $root
            SkipLaunchSmoke = $true
          }
          & ./Install-SceneDesktop.ps1 @installerArgs
          if (!(Test-Path (Join-Path $root "current/SceneDesktopStudio.exe"))) { throw "Installer missing EXE" }
          New-Item -ItemType Directory -Path (Join-Path $root "project-data") -Force | Out-Null
          "PRESERVE" | Set-Content (Join-Path $root "project-data/project.txt")
          & ./Install-SceneDesktop.ps1 @installerArgs
          if (!(Test-Path (Join-Path $root "project-data/project.txt"))) { throw "Installer touched project data" }
          if (!(Get-ChildItem (Join-Path $root "backups") -Directory)) { throw "App release backup absent" }
          $receipt = Get-Content (Join-Path $root "last-install.json") -Raw | ConvertFrom-Json
          if ($receipt.result -ne "MANUAL_INSTALL_PASS") { throw "No install receipt" }
          Write-Output "CI_ONLY_MANUAL_INSTALL_AND_BACKUP=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: SceneDesktopStudio-windows-x64-${{ github.sha }}
          path: |
            SceneDesktopStudio-windows-x64.zip
            SceneDesktopStudio-windows-x64.zip.sha256
            Install-SceneDesktop.ps1
          if-no-files-found: error
          retention-days: 14
