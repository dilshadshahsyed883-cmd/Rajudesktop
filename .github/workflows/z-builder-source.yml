name: Z Builder Windows Python Source

on:
  push:
    paths:
      - 'z_builder/**'
      - 'tests/test_z_builder*.py'
      - 'Z_BUILDER.md'
      - '.github/workflows/z-builder-source.yml'
  pull_request:
    paths:
      - 'z_builder/**'
      - 'tests/test_z_builder*.py'
      - 'Z_BUILDER.md'
      - '.github/workflows/z-builder-source.yml'

jobs:
  source-and-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test/runtime dependencies
        run: python -m pip install -r requirements-z-builder.txt
      - name: Validate syntax and run Z Studio draft integration tests
        run: python -m unittest discover -s tests -p 'test_z_builder*.py' -v
      - name: Make runnable Python source ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'z_builder','autocapcut_transitions_only','capcut_visual_controls_standalone','launch_z_builder.py','start_z_builder.bat','requirements-z-builder.txt','Z_BUILDER.md','EXAMPLE_SCENE_PLAN.txt','tests/test_z_builder.py','tests/test_z_builder_timing.py','tests/test_z_builder_parts.py' -DestinationPath 'Z-Builder-Windows-Python-Source.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Z-Builder-Windows-Python-Source-v6.2
          path: Z-Builder-Windows-Python-Source.zip
          retention-days: 30
