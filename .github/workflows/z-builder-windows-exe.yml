name: Z Builder V6.3 — Windows standalone release

on:
  push:
    branches: [main]
    paths:
      - 'z_builder/**'
      - 'autocapcut_transitions_only/**'
      - 'capcut_visual_controls_standalone/**'
      - 'launch_z_builder.py'
      - 'tests/test_z_builder*.py'
      - '.github/workflows/z-builder-windows-exe.yml'
  pull_request:
    paths:
      - 'z_builder/**'
      - 'autocapcut_transitions_only/**'
      - 'capcut_visual_controls_standalone/**'
      - 'launch_z_builder.py'
      - 'tests/test_z_builder*.py'
      - '.github/workflows/z-builder-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install requirements and PyInstaller
        run: python -m pip install -r requirements-z-builder.txt pyinstaller
      - name: Run V6.3 regressions, native transitions and Scale engine
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_z_builder*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Z Builder tests failed' }
          python -m unittest discover -s autocapcut_transitions_only/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Transition tests failed' }
          python -m unittest discover -s capcut_visual_controls_standalone/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Reference controls tests failed' }
      - name: Include official Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.runtime/node' | Out-Null
          Copy-Item (Get-Command node.exe).Source '.runtime/node/node.exe'
      - name: Build one-file Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Z_Builder_V6.3 `
            --collect-all imageio_ffmpeg `
            --collect-submodules autocapcut_transitions_only `
            --collect-submodules capcut_visual_controls_standalone `
            --add-data 'z_builder/capcut-draft.js;z_builder' `
            --add-data 'z_builder/capcut_bridge.js;z_builder' `
            --add-binary '.runtime/node/node.exe;.runtime/node' `
            launch_z_builder.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if ((Get-Item 'dist/Z_Builder_V6.3.exe').Length -lt 5MB) { throw 'Invalid EXE' }
      - name: Launch frozen EXE and verify native project workflows
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'dist/Windows-Smoke.json'
          $p = Start-Process -FilePath 'dist/Z_Builder_V6.3.exe' -ArgumentList @('--self-test-report',"`"$report`"") -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Frozen EXE timed out' }
          if ($p.ExitCode -ne 0) { throw "Frozen EXE failed: $($p.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Frozen workflow checks failed' }
          Get-Content $report
          Get-FileHash -Algorithm SHA256 'dist/Z_Builder_V6.3.exe' | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Z-Builder-V6.3-Windows-Verified
          path: |
            dist/Z_Builder_V6.3.exe
            dist/Windows-Smoke.json
            dist/Windows-Smoke.png
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Z-Builder-V6.3-Windows-Verified
          path: release
      - name: Publish verified EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s Z_Builder_V6.3.exe
          sha256sum Z_Builder_V6.3.exe > SHA256SUMS-v6.3.txt
          gh release create z-builder-v6.3-separate-layers-20261029 Z_Builder_V6.3.exe SHA256SUMS-v6.3.txt Windows-Smoke.json Windows-Smoke.png \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
             --title "Z Builder V6.3 — Separate image and video layers" \
             --notes "V6.3 retains CapCut Transitions and V2.1 Scale/Position/Blur with universal project selector; removes native Animation editor from UI and EXE. Existing animation records are preserved. Scene Plan, Media Summary, fixed images-lower/videos-upper exports, native backups, rollback and isolated frozen Windows EXE smoke remain. CapCut playback to be confirmed on installed version." --latest
