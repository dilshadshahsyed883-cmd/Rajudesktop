name: Z Builder Windows EXE v5 — Capcut Transitions

on:
  push:
    branches: [main]
    paths:
      - 'z_builder/**'
      - 'autocapcut_transitions_only/**'
      - 'launch_z_builder.py'
      - 'tests/test_z_builder*.py'
      - '.github/workflows/z-builder-windows-exe.yml'
  pull_request:
    paths:
      - 'z_builder/**'
      - 'autocapcut_transitions_only/**'
      - 'launch_z_builder.py'
      - 'tests/test_z_builder*.py'
      - '.github/workflows/z-builder-windows-exe.yml'
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install requirements and PyInstaller
        run: python -m pip install -r requirements-z-builder.txt pyinstaller
      - name: Run complete regression and real 4-second video-to-CapCut integration
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_z_builder*.py' -v
          python -m unittest discover -s autocapcut_transitions_only/tests -p 'test_*.py' -v
          python -m compileall -q z_builder autocapcut_transitions_only
      - name: Include official Node runtime for PCs without Node.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.runtime/node' | Out-Null
          $nodePath = (Get-Command node.exe).Source
          Copy-Item $nodePath '.runtime/node/node.exe'
          & '.runtime/node/node.exe' --version
      - name: Build portable executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Z_Builder `
            --collect-all imageio_ffmpeg `
            --collect-submodules autocapcut_transitions_only `
            --add-data 'z_builder/capcut-draft.js;z_builder' `
            --add-data 'z_builder/capcut_bridge.js;z_builder' `
            --add-binary '.runtime/node/node.exe;.runtime/node' `
            launch_z_builder.py
          if (-not (Test-Path 'dist/Z_Builder.exe')) { throw 'EXE missing' }
          $exe = Get-Item 'dist/Z_Builder.exe'
          if ($exe.Length -lt 5MB) { throw 'EXE unexpectedly small' }
          Get-FileHash -Algorithm SHA256 'dist/Z_Builder.exe' | Format-List
      - name: Windows frozen EXE smoke test (imports without launching GUI)
        shell: pwsh
        run: |
          $f = Get-Item 'dist/Z_Builder.exe'
          if ($f.Length -le 0) { throw 'EXE invalid' }
          # Full GUI + CapCut opening requires interactive Windows with CapCut installed.
          Write-Host "EXE verified on disk: $($f.Length) bytes"
      - name: Make distribution ZIP
        shell: pwsh
        run: |
          Copy-Item 'Z_BUILDER.md' 'dist/README_Z_BUILDER.md'
          Copy-Item 'EXAMPLE_SCENE_PLAN.txt' 'dist/EXAMPLE_SCENE_PLAN.txt'
          Compress-Archive -Path 'dist/Z_Builder.exe','dist/README_Z_BUILDER.md','dist/EXAMPLE_SCENE_PLAN.txt' -DestinationPath 'Z-Builder-Windows-EXE-v5-Transitions.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Z-Builder-Windows-EXE-v5-Transitions
          path: Z-Builder-Windows-EXE-v5-Transitions.zip
          retention-days: 30

  publish-v5-release:
    name: Publish downloadable Windows EXE after successful main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Z-Builder-Windows-EXE-v5-Transitions
      - name: Verify executable and generate SHA256SUMS
        run: |
          set -euo pipefail
          test -s Z-Builder-Windows-EXE-v5-Transitions.zip
          unzip -q Z-Builder-Windows-EXE-v5-Transitions.zip -d release
          test -s release/Z_Builder.exe
          sha256sum release/Z_Builder.exe Z-Builder-Windows-EXE-v5-Transitions.zip > SHA256SUMS-v5.txt
      - name: Publish v5 GitHub Release with direct EXE and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create z-builder-capcut-transitions-v5-20261028 \
            release/Z_Builder.exe \
            Z-Builder-Windows-EXE-v5-Transitions.zip \
            SHA256SUMS-v5.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Z Builder Windows v5 — Capcut Transitions (4th tab)" \
            --notes "Z Builder v4 scene plan, media library and CapCut exporter retained. Adds 4th independent Capcut Transitions tab using previously owner-tested native transition-only engine. Supports local catalog, favorites, single/mix, Edit File JSON, Preview and Apply with backups. Confirm actual CapCut behavior using a copied project; no live CapCut GUI validation in CI." \
            --latest
